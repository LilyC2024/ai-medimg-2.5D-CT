[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-medimg-playground"
version = "0.10.0"
description = "Local lung nodule research assistant: source-linked 3D candidates, physical measurements and human-reviewed reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DATA_TERMS.md", "third_party/*.txt"]
dependencies = [
  "matplotlib",
  "numpy",
  "pillow>=13,<14",
  "opencv-python",
  "pandas",
  "pydicom",
  "scikit-image",
  "scipy",
  "SimpleITK",
  "tqdm",
  "pydantic>=2,<3",
  "cryptography>=44,<51",
]

[project.optional-dependencies]
intel = ["openvino"]
lung = ["monai>=1.4,<1.7", "nibabel>=5,<6", "torch", "torchvision"]
training = ["monai>=1.4,<1.7", "nibabel>=5,<6", "torch", "torchvision", "pytorch-ignite", "tensorboard"]
ui = ["streamlit>=1.40,<2"]
codecs = ["pylibjpeg", "pylibjpeg-libjpeg"]
ml = [
  "fastapi",
  "onnx",
  "onnxruntime",
  "python-multipart",
  "torch",
  "uvicorn",
]
dev = [
  "ruff",
  "pytest",
  "httpx",
]
quality = [
  "mypy==2.4.0",
  "pytest-cov==7.1.0",
  "pip-audit==2.10.1",
  "cyclonedx-bom==7.5.0",
]

[project.scripts]
lung-nodule = "lung_nodule.cli:main"
lung-research = "lung_nodule.research:main"

[tool.setuptools]
package-dir = {"" = "src", "deploy" = "deploy"}
packages = ["data", "models", "baselines", "deploy", "lung_nodule"]
py-modules = ["calibration", "config", "dicom_loader", "preprocessing", "robustness", "visualization", "public_metadata", "evaluation"]


[tool.ruff]
exclude = ["artifacts", "data", "data_processed", "outputs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = [
  "src/lung_nodule/contracts.py",
  "src/lung_nodule/exchange_contract.py",
  "src/lung_nodule/workspace.py",
  "src/lung_nodule/producer_signature.py",
]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.coverage.run]
source = ["src", "deploy"]

[tool.coverage.report]
fail_under = 65
