[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-medimg-playground"
version = "0.8.0"
description = "Day 1-7 DICOM ingestion, preprocessing, pseudo-labeling, 2.5D training, reporting, and deployable ONNX CPU inference."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "matplotlib",
  "numpy",
  "opencv-python",
  "pandas",
  "pydicom",
  "scikit-image",
  "scipy",
  "SimpleITK",
  "tqdm",
]

[project.optional-dependencies]
intel = ["openvino"]
codecs = ["pylibjpeg", "pylibjpeg-libjpeg"]
ml = [
  "fastapi",
  "onnx",
  "onnxruntime",
  "python-multipart",
  "torch",
  "uvicorn",
]
dev = [
  "ruff",
  "pytest",
  "httpx",
]

[tool.setuptools]
package-dir = {"" = "src", "deploy" = "deploy"}
packages = ["data", "models", "baselines", "deploy"]
py-modules = ["calibration", "config", "dicom_loader", "preprocessing", "robustness", "visualization", "public_metadata", "evaluation"]


[tool.ruff]
exclude = ["artifacts", "data", "data_processed", "outputs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
