name: Lung research and legacy compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[ml,lung,ui,dev,quality]"
      - run: python -m pip check
      - run: python scripts/check_docs.py
      - run: python scripts/generate_api_docs.py --check
      - run: python -m ruff check src scripts deploy tests
      - run: python -m ruff check src/lung_nodule --select F
      - run: python -m ruff format --check src/lung_nodule
      - name: Type-check shared contracts, workspaces and signing
        run: python -m mypy
      - name: Tests with coverage floor
        run: python -m pytest -q --cov --cov-report=term
      - name: Audit installed dependencies and write SBOM
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip setuptools filelock
          python -m pip_audit --skip-editable --local
          python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
          cyclonedx-py environment -o artifacts/sbom.cdx.json
      - name: Upload SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ct-sbom
          path: artifacts/sbom.cdx.json
          retention-days: 30
      - name: Exercise unreviewed nodule fixture workflow
        run: python scripts/smoke_lung.py --output artifacts/lung-fixture-smoke.json
      - name: Exercise synthetic MHCRA bundle command
        run: python -m deploy.mhcra_bridge --demo --patient-id synthetic-checklist --study-id ci-study --output-dir artifacts/ci-mhcra
      - name: Exercise pending nodule-v2 bridge
        run: python -m deploy.mhcra_lung_bridge --patient-id synthetic-checklist --study-id ci-lung --output-dir artifacts/ci-lung --mode fixture --device cpu
      - name: Build and exercise CPU container with synthetic data
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/generate_fixture.py artifacts/container/series
          python scripts/prepare_case.py --series-dir artifacts/container/series --output-dir artifacts/container/processed
          python scripts/train.py --index-path artifacts/container/processed/index.csv --output-dir artifacts/container/train --model-dir artifacts/container/models --epochs 1 --image-size 32,32 --base-channels 2
          python scripts/export_verified.py --checkpoint artifacts/container/models/best.pt --index artifacts/container/processed/index.csv --onnx artifacts/container/model.onnx --output artifacts/container/runtime
          docker build -t ct25d-cpu .
          docker run --rm -v "$GITHUB_WORKSPACE/artifacts/container:/work" ct25d-cpu demo --output /work/lung-demo
          docker run --rm --entrypoint python -v "$GITHUB_WORKSPACE/artifacts/container:/work" ct25d-cpu -m deploy.cli_infer --series-dir /work/series --checkpoint /work/models/best.pt --onnx-path /work/model.onnx --output-dir /work/prediction --output-formats mask
          python -c "import numpy as np; d=np.load('artifacts/container/prediction/prediction_mask.npz'); assert d['predicted_labels'].shape==(20,48,48); assert d['predicted_labels'].max()<=3"
  pretrained-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[lung]"
      - name: Explicit setup-only fetch of fixed official model revision
        run: python -m lung_nodule.cli fetch-model --output models/luna16
      - name: Actual pretrained inference on generated phantom only
        run: python scripts/smoke_lung.py --model-dir models/luna16 --device cpu --output artifacts/pretrained-smoke.json
      - name: Exercise real pretrained pending nodule-v2 bridge
        run: python -m deploy.mhcra_lung_bridge --patient-id synthetic-checklist --study-id ci-lung-pretrained --output-dir artifacts/ci-lung-pretrained --mode pretrained --model-dir models/luna16 --device cpu
      - uses: actions/upload-artifact@v4
        with:
          name: generated-phantom-pretrained-smoke
          path: artifacts/pretrained-smoke.json
