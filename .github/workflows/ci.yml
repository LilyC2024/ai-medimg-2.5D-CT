name: Synthetic CPU validation
on: [push, pull_request]
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[ml,dev]"
      - run: python -m ruff check src scripts deploy tests
      - run: python -m unittest discover -s tests -v
